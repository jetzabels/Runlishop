<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Run li shop - Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { background-color: #1a1a1a; border-bottom: 3px solid #007bff; }
        .container { margin-top: 40px; }
        .card { border: none; border-radius: 15px; }
        .table thead { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">👟 RUN LI SHOP - Sistema de Inventario</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-lg">
        <div class="card-header bg-white py-3">
            <h3 class="text-primary m-0">Lista de Tenis en Existencia</h3>
        </div>
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Modelo</th>
                    <th>Costo (China)</th>
                    <th>Stock Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tenis : ${listaTenis}">
                    <td th:text="${tenis.id}" class="fw-bold">1</td>
                    <td th:text="${tenis.modelo}">Cargando...</td>
                    <td th:text="${'$' + tenis.costo_china}">$0.00</td>
                    <td th:text="${tenis.stock_total}">0</td>
                    <td>
                        <span th:if="${tenis.stock_total > 10}" class="badge bg-success">Disponible</span>
                        <span th:if="${tenis.stock_total <= 10}" class="badge bg-warning text-dark">Bajo Stock</span>
                    </td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm">📦 Detalles</button>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(listaTenis)}" class="alert alert-info text-center">
                No hay tenis registrados en la base de datos. ¡Agrega uno en MySQL!
            </div>

            <button class="btn btn-primary mt-3 shadow-sm">+ Registrar Nuevo Pedido</button>
        </div>
    </div>
</div>

<footer class="text-center mt-5 text-muted">
    <p>&copy; 2026 Run li shop - Panel Administrativo</p>
</footer>

</body>
</html>
